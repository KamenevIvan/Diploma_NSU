[project]
name = "manip-tester"
version = "0.1.0"
description = "Мультиагентное тестирование устойчивости диалоговых AI-агентов к манипулятивным техникам убеждения"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "openai>=1.0",
    "pytest (>=9.2.0,<10.0.0)",
]

[tool.poetry]
packages = [{ include = "manip_tester" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.6"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
